name: tests
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: |
          cd app
          fail=0
          for t in ../tests/t*.py; do
            if ! timeout 280 python3 "$t" >/tmp/out.txt 2>&1; then
              echo "retry $t"; timeout 280 python3 "$t" >/tmp/out.txt 2>&1 || { echo "FAILED: $t"; tail -15 /tmp/out.txt; fail=1; }
            fi
          done
          exit $fail
