name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        # هر تست جدا اجرا می‌شه (بعضی تست‌ها زمان‌بندی دارن؛ یک بار دوباره امتحان می‌کنیم). تست‌های بخش «xray واقعی» بدون فایل xray رد می‌شن.
        run: |
          cd app
          fail=0
          for t in ../tests/t*.py; do
            if ! timeout 280 python3 "$t" >/tmp/out.txt 2>&1; then
              echo "retry $t"; timeout 280 python3 "$t" >/tmp/out.txt 2>&1 || { echo "FAILED: $t"; tail -15 /tmp/out.txt; fail=1; }
            fi
          done
          exit $fail
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 zip unzip
      - name: build
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ConfigTool-windows
          path: |
            dist/ConfigTool.exe
            dist/ConfigTool.exe.sha256
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ConfigTool.exe
            dist/ConfigTool.exe.sha256
