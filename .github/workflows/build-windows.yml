name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 zip unzip
      - name: build
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ConfigTool-windows
          path: |
            dist/ConfigTool.exe
            dist/ConfigTool.exe.sha256
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ConfigTool.exe
            dist/ConfigTool.exe.sha256
